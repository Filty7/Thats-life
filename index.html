<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A9C6D6">
<title>To je život</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: pixelová krajina s vesničkou jako pozadí, nad ní pár karet jako na stole, dole dlouhá osa dne – hlavní dominanta */
:root{
  --ink:#33302E; --muted:#7A746B; --paper:#F5F1E6; --paper2:#E9E3D3; --line:#33302E;
  --day:#EFE9D9; --night:#DCDCE4; --accent:#5D86A8;
  --good:#4F9A5E; --bad:#C9554E;
  --hp:#D9706C; --en:#E2B04A; --st:#8A8597;
  --display:'Baloo 2',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#A9C6D6;color:var(--ink);font-family:var(--body);font-size:14px;user-select:none;-webkit-user-select:none;position:relative}
button{font:inherit;color:inherit}
#scene{position:absolute;top:0;left:0;width:100%;z-index:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;min-height:660px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.box{background:var(--paper);border:2.5px solid var(--line);border-radius:8px;box-shadow:0 3px 0 var(--line)}

.head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;gap:10px;flex-wrap:wrap}
.brand{padding:4px 14px;font-family:var(--display);font-weight:600;font-size:18px}
.ctrl{display:flex;gap:8px}
.speed{display:flex;padding:2px;gap:2px}
.speed button,.helpb{border:0;background:transparent;padding:4px 11px;border-radius:5px;cursor:pointer;font-weight:800;font-size:13px}
.speed button.on{background:var(--ink);color:var(--paper)}
.helpb{padding:5px 12px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.sky{flex:1;position:relative;min-height:230px}
.offers{position:absolute;left:160px;right:16px;top:8px;bottom:56px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:18px 20px}
.chipsrow{position:absolute;left:16px;right:16px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:4;pointer-events:none}
.chipsrow>*{pointer-events:auto}
.cms{display:flex;gap:8px;flex-wrap:wrap}
.recentBtn{padding:5px 12px;font-weight:800;font-size:12.5px;cursor:pointer}
.cm{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;font-weight:800;font-size:12.5px;cursor:pointer}
.cm .ai{font-size:15px;display:inline-flex}
.cm b{font-family:var(--display);font-weight:600}
.cm small{font-size:11px;color:var(--muted);font-weight:800}
.cm b.g{color:var(--good)}
.acts{position:absolute;left:16px;top:8px;display:grid;grid-template-columns:repeat(2,64px);gap:6px;z-index:4;align-content:start}
.act{width:64px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800;cursor:pointer;line-height:1.1;text-align:center;padding:4px}
.act .ai{font-size:21px;display:inline-flex}
.act.off{opacity:.45}
.act:not(.off):hover{background:var(--paper2)}
.card .x{position:absolute;top:10px;right:12px;border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}
.card{position:relative}
.card h3{font-family:var(--display);font-weight:600;font-size:24px;margin:0 0 6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2.5px solid var(--ink);border-radius:8px;background:var(--paper);padding:9px 13px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.opt:hover:not(.off){background:var(--paper2)}
.opt b{font-family:var(--display);font-weight:600;font-size:16px}
.opt span{font-size:13px;font-weight:800}
.opt small{font-size:12px;font-weight:700;color:var(--muted)}
.opt.off{opacity:.45;cursor:default}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pk{display:flex;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.pk .ai{font-size:18px;display:inline-flex}
.births{display:flex;gap:10px;flex-wrap:wrap}
.tray{position:absolute;left:16px;bottom:48px;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:7;max-width:280px}
.chip{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;font-weight:800;font-size:12.5px;text-align:left}
.chip .ic{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.chip span:nth-child(2){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{filter:brightness(1.06)}
.seg.cutR{border-right-width:0;border-top-right-radius:0;border-bottom-right-radius:0}
.seg.cutL{border-left-width:0;border-top-left-radius:0;border-bottom-left-radius:0}
.lbl .mob{position:absolute;bottom:3px;right:5px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;font-family:var(--display);font-weight:600;font-size:11px;line-height:1;padding:2px 5px;color:var(--ink)}
.lbl .mob.plus{color:var(--good)}
.lbl em.mo{font-style:normal;font-size:12px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:1px}
.lbl em.mo.plus{color:var(--good)}
[data-stat]{cursor:help}
.tip .sr{display:flex;justify-content:space-between;gap:16px}
.tip .sr b.g{color:var(--good)} .tip .sr b.b{color:var(--bad)}
.tip .sr.tot{border-top:2px solid var(--paper2);margin-top:3px;padding-top:3px}
.card.wide{max-width:720px}
.story p{margin:0 0 10px;font-size:14.5px;line-height:1.55;font-weight:700}
.sumchart{width:100%;height:auto;display:block;margin:6px 0 4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;font-weight:800;color:var(--muted)}
.legend .lg{display:inline-flex;align-items:center;gap:5px}
.legend .lg i{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--ink)}
.tbar{display:flex;height:18px;border:2px solid var(--ink);border-radius:5px;overflow:hidden;margin:6px 0}
.tbar i{display:block;height:100%}
.facts{margin:14px 0 20px;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 16px;font-size:13.5px;font-weight:700}
.toasts{position:absolute;right:16px;top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;z-index:5;max-width:min(300px,60%)}
.toast{display:flex;align-items:center;gap:8px;padding:6px 11px;font-size:13px;font-weight:800;animation:tin .8s ease both;transition:opacity 1.5s}
.toast i{width:8px;height:8px;border-radius:2px;flex:none;background:var(--accent)}
.toast.good i{background:var(--good)} .toast.bad i{background:var(--bad)} .toast.mot i{background:#9A84C9}
.toast.out{opacity:0}
@keyframes tin{from{opacity:0;transform:translateY(5px)}}

.oc{width:110px;height:146px;border:2.5px solid var(--line);border-radius:7px;position:relative;cursor:grab;touch-action:none;
  box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;animation:deal 1s cubic-bezier(.2,.8,.3,1) both, bob 8s ease-in-out infinite;animation-delay:0s,var(--d,0s);transition:opacity 1.2s,translate .25s,rotate .25s}
.oc:hover{animation-play-state:running,paused;translate:0 -5px;rotate:-1.5deg}
@keyframes deal{0%{opacity:0;transform:translateY(-40px) rotate(-8deg)}60%{opacity:1;transform:translateY(4px) rotate(1.5deg)}100%{opacity:1;transform:none}}
.oc.dragsrc{opacity:.3}
.oc.gone{animation:none;opacity:0;transform:translateY(-18px) rotate(4deg);transition:opacity 1.3s,transform 1.3s}
.oc.shake{animation:shake .35s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.oc .hd{border-bottom:2.5px solid var(--line);padding:3px 7px;font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px 4px 0 0}
.oc .bd{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;padding-top:9px;border-radius:0 0 4px 4px}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(rgba(255,255,255,.6) calc(var(--t,1)*1turn),rgba(255,255,255,.16) 0)}
.ring span{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.42);display:flex;align-items:center;justify-content:center;gap:2px;font-size:32px}
.ring span.two{font-size:23px}
.daybar{display:flex;gap:1px;margin-top:9px;width:84px}
.daybar i{flex:1;height:5px;border-radius:1px;background:rgba(51,48,46,.14)}
.daybar i.on{background:rgba(51,48,46,.72)}
.bdg{position:absolute;bottom:6px;font-family:var(--display);font-weight:600;font-size:13px;line-height:1}
.bdg.hrs{left:6px;background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 7px}
.bdg.mon{right:6px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 6px}
.bdg.mon.plus{color:var(--good)}
.bdg.yrs{top:-11px;right:-10px;bottom:auto;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 7px;font-size:11px;z-index:2}
.oc.locked .bd{filter:saturate(.55)}
.lbl .gap{position:absolute;top:3px;right:5px;background:var(--bad);color:#fff;border:2px solid var(--ink);border-radius:999px;font-family:var(--display);font-weight:600;font-size:11px;line-height:1;padding:2px 5px}
.lockb{position:absolute;top:-12px;right:-12px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:15px;z-index:2}
.oc .req{position:absolute;left:5px;top:5px;background:var(--paper);color:var(--bad);border:2px solid var(--ink);border-radius:999px;padding:1px 6px 1px 4px;font-family:var(--display);font-weight:600;font-size:12px;display:flex;align-items:center;gap:2px}

.dock{padding:0 14px 14px}
.panel{padding:12px 16px 12px;display:flex;flex-direction:column;gap:10px;margin-top:14px;border-radius:10px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:13px}
.hap{display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 12px 3px 8px;font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.hap svg{font-size:18px;color:#F2D07A}
.mon2{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.mon2 svg{font-size:17px;color:#B98F2E}
.mon2 .neg{color:var(--bad)}
.mon2 small{color:var(--muted);font-weight:700}
.meter{display:flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums}
.meter svg{font-size:16px}
.meter .tk{width:62px;height:10px;border-radius:3px;background:var(--paper2);border:2px solid var(--ink);overflow:hidden;position:relative}
.meter .tk i{display:block;height:100%;transition:width .4s linear}
.meter .tk .cap{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(-45deg,#c9c1ad 0 2px,transparent 2px 4px)}
.meter .n{min-width:26px;text-align:right}
#money{display:inline-block;min-width:4.6em;text-align:right}
#monthly{display:inline-block;min-width:6.2em}
#score{display:inline-block;min-width:2.2em;text-align:right}
.tr{font-size:8px;letter-spacing:-1px;width:18px;display:inline-block}
.tr.good{color:var(--good)} .tr.bad{color:var(--bad)}
.sep{width:2px;height:20px;background:var(--paper2);border-radius:1px}
.skills,.mots{display:flex;gap:6px;align-items:center}
.lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
.skc{--p:0;position:relative;width:30px;height:30px;border-radius:6px;border:2px solid var(--ink);display:grid;place-items:center;font-size:15px;overflow:hidden}
.skc.zero{background:var(--paper2)!important;color:#9C9483}
.skc::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p)*100%);background:var(--ink);opacity:.55}
.skc b{position:absolute;right:2px;top:0;font-family:var(--display);font-weight:600;font-size:10px}
.mt{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:999px;padding:1px 8px 1px 6px;font-family:var(--display);font-weight:600;font-size:13px}
.mt svg{font-size:14px}
.mt.neg{background:#CFC9D8}
.mt.empty{border-style:dashed;border-color:#bdb5a3;color:var(--muted)}

.agerow{display:flex;align-items:center;gap:12px}
.agen{font-family:var(--display);font-weight:600;font-size:20px;white-space:nowrap;min-width:72px;font-variant-numeric:tabular-nums}
.agen small{font-size:13px;color:var(--muted);margin-left:3px}
.agetrack{flex:1;height:10px;border-radius:3px;background:var(--paper2);border:2px solid var(--ink);position:relative}
.agerow{padding-top:26px}
#kid{position:absolute;bottom:3px;width:40px;height:40px;transform:translateX(-50%);image-rendering:pixelated;pointer-events:none}
.agetrack .fill{position:absolute;left:0;top:0;bottom:0;background:#A6BFA0}
.agetrack .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.35}
.agetrack .mk span{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);font-weight:800}
.season{font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap;min-width:60px;text-align:right}

.tlwrap{overflow-x:auto;padding:2px 0}
.tl{min-width:720px;position:relative}
#track{position:relative;height:124px;border-radius:8px;background:var(--paper2);border:2.5px solid var(--ink);touch-action:none}
#track .layer,#track .dl{position:absolute;inset:0}
#track .dl{pointer-events:none}
.tile{position:absolute;top:4px;bottom:4px;border-radius:4px}
.tile.d{background:var(--day)} .tile.n{background:var(--night)}
.restlbl{position:absolute;top:50%;transform:translateY(-50%);text-align:center;font-size:12px;font-weight:800;color:#A39C8C;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.seg{position:absolute;border:2.5px solid var(--ink);border-radius:6px;cursor:grab;overflow:hidden;transition:filter .2s}
.seg .hz{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,rgba(51,48,46,.14) 0 3px,transparent 3px 9px);pointer-events:none}
.seg .hz.cov{background:repeating-linear-gradient(-45deg,rgba(51,48,46,.3) 0 3px,rgba(245,241,230,.5) 3px 9px)}
.seg.ev{cursor:not-allowed}
.seg.hov{filter:brightness(1.08) saturate(1.05);z-index:4}
.seg.dragging{opacity:.3}
.seg.grow{animation:pulse 2.2s infinite}
@keyframes pulse{50%{filter:brightness(1.15)}}
.lbl{position:absolute;inset:0;z-index:1;display:flex;align-items:center;gap:8px;padding:0 8px;white-space:nowrap;overflow:hidden;color:var(--ink)}
.lbl .ic{width:40px;height:40px;flex:none;border-radius:50%;background:rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;font-size:22px}
.lbl .t{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.lbl .t b{font-family:var(--display);font-weight:600;font-size:16px}
.lbl .t small{font-size:11.5px;font-weight:800;opacity:.75;overflow:hidden;text-overflow:ellipsis}
.lbl.sm{justify-content:center;padding:0 2px}
.lbl.sm .ic{width:26px;height:26px;font-size:15px}
.win{position:absolute;top:0;bottom:0;background:rgba(93,134,168,.13);border:2.5px dashed var(--accent);border-radius:7px}
.win span{position:absolute;top:4px;left:4px;z-index:3;background:var(--ink);color:var(--paper);font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;white-space:nowrap}
.prev{position:absolute;top:5px;bottom:5px;border-radius:5px;border:3px dashed var(--ink);opacity:.85}
.axis{position:relative;height:18px;margin-top:4px}
.axis span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.axis span.big{color:var(--ink)}
.axis span:first-child{transform:none} .axis span:last-child{transform:translateX(-100%)}

.qolrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qs{display:flex;gap:3px}
.q{width:26px;height:26px;border-radius:5px;border:2px solid var(--ink);background:var(--paper);cursor:pointer;font-family:var(--display);font-weight:600;font-size:12.5px}
.q:disabled{cursor:default;opacity:.4}
.q.cur{background:var(--ink);color:var(--paper);opacity:1}
.q:not(:disabled):not(.cur):hover{background:var(--paper2)}
.qinfo{font-size:12.5px;color:var(--muted);flex:1;min-width:220px;font-weight:700}
.qinfo b{color:var(--ink)}
.btn{border:2.5px solid var(--ink);border-radius:7px;padding:6px 14px;font-weight:800;cursor:pointer;background:#A6C3D9;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pulse{animation:bp 2.4s infinite}
@keyframes bp{50%{background:#C3D7E6}}

.ghost{position:fixed;z-index:50;pointer-events:none;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:2.5px solid var(--ink);border-radius:999px;font-weight:800;font-size:13px;box-shadow:0 4px 0 var(--ink);transform:translate(-50%,-130%) rotate(-2deg);white-space:nowrap;color:var(--ink)}
.ghost .ic{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:17px}
.ghost.rm{background:#E59A94!important}
.tip{position:fixed;z-index:40;pointer-events:none;padding:9px 12px;font-size:12.5px;max-width:240px;line-height:1.5;font-weight:700}
.tip h4{margin:0 0 2px;font-family:var(--display);font-weight:600;font-size:15px}
.tip .k{color:var(--muted)}
.tip .fx{display:flex;flex-wrap:wrap;gap:0 10px}
.tip .fx b{font-size:9px;letter-spacing:-1px;margin-left:2px}
.tip .fx .g b{color:var(--good)} .tip .fx .b b{color:var(--bad)} .tip .fx .h b{color:var(--accent)}

.ov{position:fixed;inset:0;background:rgba(51,48,46,.3);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.card{padding:26px 28px;max-width:520px;width:100%;max-height:100%;overflow:auto;border-radius:12px;box-shadow:0 6px 0 var(--ink)}
.card h2{font-family:var(--display);font-weight:600;font-size:32px;margin:0 0 6px;text-wrap:balance}
.card p.lead{color:var(--muted);margin:0 0 16px;font-size:15px;line-height:1.5;font-weight:700}
.rules{margin:0 0 22px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;line-height:1.45;font-size:14px;font-weight:700}
.rules li span.e{width:32px;height:32px;border-radius:6px;border:2px solid var(--ink);display:grid;place-items:center;font-size:16px}
.card .btn{font-size:15px;padding:9px 20px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats3 div{background:var(--paper2);border-radius:8px;padding:10px 12px}
.stats3 b{display:block;font-family:var(--display);font-size:21px;font-weight:600}
.stats3 span{font-size:12px;color:var(--muted);font-weight:800}
.loglist{font-size:13.5px;line-height:1.55;margin:6px 0 20px;padding-left:18px;max-height:200px;overflow:auto;font-weight:700}
.seg.fresh{animation:land .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes land{0%{transform:scaleY(.3);opacity:.3}100%{transform:none;opacity:1}}
.skc.lvlup,.mt.glow{animation:lvl 1.5s ease;z-index:3}

function layout(){
  const stacks=Array.from({length:24},()=>[]);
  for(const p of S.placed)for(const s of slotsOf(p))stacks[s].push(p);
  stacks.forEach(st=>st.sort((a,b)=>b.z-a.z));
  const restEff=[];
  for(let s=0;s<24;s++){if(stacks[s].length){restEff[s]=0;continue}
    const c=(6+s)%24,night=c>=20||c<8;
    restEff[s]=1+(night?0.1:0)+(stacks[(s+23)%24].length?0:0.1)+(stacks[(s+1)%24].length?0:0.1)}
  return {stacks,restEff};
}

function assignLanes(){
  const ps=S.placed,sets=new Map(ps.map(p=>[p,new Set(slotsOf(p))]));

  const seen=new Set();
  for(const p of ps){if(seen.has(p))continue;const cl=[p];seen.add(p);
    for(let i=0;i<cl.length;i++)for(const q of ps)if(!seen.has(q)&&ov(cl[i],q)){seen.add(q);cl.push(q)}
    cl.sort((a,b)=>b.z-a.z);const lanes=[];
    for(const x of cl){let l=0;while(lanes[l]&&lanes[l].some(q=>ov(q,x)))l++;(lanes[l]=lanes[l]||[]).push(x);x._lane=l}

}

    for(let i=0;i<n;i++)birds.push({x:(dir>0?-6:LW+6)-dir*i*4,y:y0+i*2*(i%2?1:-1),v:dir*(7+rnd()),ph:rnd()*6})}

const lc1=t=>t.replace(/^(\p{Lu})(?!\p{Lu})/u,m=>m.toLowerCase()).replace(/ v praze/,' v Praze');
const isF=()=>S&&S.gender==='f';
function nm(c){const n=c.name;if(!n.includes('|'))return n;const [m,f]=n.split('|');return isF()?f:m}
function gtxt(t){if(typeof t!=='string')return t;const f=isF();
  return t.replace(/Prošel\/la/g,f?'Prošla':'Prošel').replace(/Odešel\/odešla/g,f?'Odešla':'Odešel').replace(/([Oo])dešel\/a/g,f?'$1dešla':'$1dešel')
    .replace(/Dožil\/a/g,f?'Dožila':'Dožil').replace(/([\p{L}]+)ý\/á/gu,f?'$1á':'$1ý').replace(/rád\/a/g,f?'ráda':'rád').replace(/([\p{L}]+)\/a\b/gu,f?'$1a':'$1')}

/* ============ PENÍZE: PŮJČKY, BYDLENÍ, INVESTICE ============ */
const annuity=(P,rateY,years)=>{const r=rateY/12,n=years*12;return P*r/(1-Math.pow(1+r,-n))};
const principalLeft=l=>{const r=l.rate/12;return l.pay*(1-Math.pow(1+r,-l.left))/r};
const homePrice=t=>QOL[t].cost*180;
function addLoan(name,P,rate,years,kind){const l={id:++uidC,name,pay:annuity(P,rate,years),left:years*12,total:years*12,rate,kind,P};S.loans.push(l);renderChips();return l}
function loanTick(dt){const m=12/YEAR*dt;let ch=false;
  for(const l of [...S.loans]){l.left-=m;if(l.left<=0){S.loans=S.loans.filter(x=>x!==l);ch=true;toast(`Splaceno: ${l.name.toLowerCase()}`,'good');S.log.push(`${Math.floor(S.age)} let – splaceno: ${l.name.toLowerCase()}.`);
    if(S.own&&S.own.loan===l.id)S.own.loan=null;for(const r of S.rentals)if(r.loan===l.id)r.loan=null}}
  if(ch)renderChips()}
function yearMoneyTick(){
  if(S.own)S.own.value*=1.03;for(const r of S.rentals)r.value*=1.03;
  if(S.inv>0){const g=(()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)})();
    const ret=0.06+0.14*g;S.inv=Math.max(0,S.inv*(1+ret));if(ret<-0.12)toast(`Investice letos ztratily ${Math.round(-ret*100)} %`,'bad');else if(ret>0.2)toast(`Investice letos vydělaly ${Math.round(ret*100)} %`,'good')}
  renderChips();
}
function sellValue(p){const l=S.loans.find(x=>x.id===p.loan);return p.value*0.95-(l?principalLeft(l):0)}
function closeLoan(id){S.loans=S.loans.filter(x=>x.id!==id)}

function familyMoneyParts(){let kids=0;for(const k of aliveKids()){const a=kidAge(k);if(a<18)kids-=5000;else if(a<25&&k.rel>40)kids-=2500}
  return {kids,partner:S.partner?(S.partner.married?10000:4000):0,ins:S.ins?-1500:0,car:S.car?-S.car.upkeep:0}}
const F_NAMES=['Jana','Tereza','Eliška','Anna','Klára','Lucie','Veronika','Kateřina','Adéla','Barbora','Natálie','Markéta','Zuzana','Petra','Ema','Sofie','Karolína','Nela'];
const M_NAMES=['Jakub','Tomáš','Jan','Adam','Matěj','Filip','Ondřej','Lukáš','David','Vojtěch','Martin','Petr','Daniel','Michal','Šimon','Marek','Vít','Kryštof'];
const pickName=g=>{const L=g==='f'?F_NAMES:M_NAMES;const used=new Set([...(S.kids||[]).map(k=>k.name),S.partner&&S.partner.name]);const f=L.filter(n=>!used.has(n));return (f.length?f:L)[Math.floor(rnd()*(f.length||L.length))]};
const gw=(g,m,f)=>g==='f'?f:m;                       // tvar slova podle pohlaví někoho jiného
const GENFAM=new Set(['Rodinné večery','Chata s rodinou']);
const kidAge=k=>S.age-k.born;
const aliveKids=()=>S.kids.filter(k=>k.alive);
function needOk(c){switch(c.need){
  case 'single':return !S.partner;case 'partner':return !!S.partner&&!S.partner.married;case 'married':return !!(S.partner&&S.partner.married);
  case 'kids':return aliveKids().some(k=>kidAge(k)<18);case 'baby':return aliveKids().some(k=>kidAge(k)<3);
  case 'grand':return S.kids.some(k=>k.grand>0);default:return true}}
function dropInvalidFamilyCards(){const bad=S.placed.filter(p=>!p.ev&&!needOk(p.card));
  for(const p of bad){endPlaced(p);removePlaced(p);toast(`Už to nejde: ${nm(p.card).toLowerCase()}`)}}
function familyHours(R){let ph=0,kh=0;
  for(const p of S.placed){if(p.ev)continue;const c=p.card,eh=(R.eff.get(p.uid)||0)*c.h;
    if(c.need==='partner'||c.need==='married')ph+=eh;if(c.need==='kids'||c.need==='baby')kh+=eh;if(GENFAM.has(c.name)){ph+=0.5*eh;kh+=0.6*eh}}
  return {ph,kh}}
function familyEnergy(){let u=0;for(const k of aliveKids()){const a=kidAge(k);if(a<3)u-=1.5;else if(a<10)u-=0.6}return u}
function familyMoney(){let m=0;for(const k of aliveKids()){const a=kidAge(k);if(a<18)m-=7000;else if(a<25&&k.rel>40)m-=3000}
  if(S.partner)m+=S.partner.married?10000:4000;if(S.ins)m-=1500;if(S.car)m-=S.car.upkeep;return m}
function familyTick(dt,R){
  const yr=dt/YEAR,{ph,kh}=familyHours(R),mR=S.mot.R||0,care=mR<0?0:mR===0?0.5:1;let sc=0,st=0;
  if(S.partner){const P=S.partner,want=P.married?2.5:2;P.rel=clamp(P.rel+(ph-want)*3*yr,0,100);
    sc+=care*(P.rel-50)/50*0.02*(1+0.3*Math.max(0,mR));if(P.rel<30)st+=care*0.08}
  const small=aliveKids().filter(k=>kidAge(k)<18);
  for(const k of aliveKids()){const a=kidAge(k);
    if(a<18){const want=a<3?3:a<12?2:1.2,given=kh/Math.sqrt(Math.max(1,small.length));k.rel=clamp(k.rel+(given-want)*2*yr,0,100);if(a<6)st+=0.02}
    else k.rel=clamp(k.rel+(kh+ph>0.5?0.4:-0.6)*yr,0,100);
    sc+=care*(k.rel-50)/50*0.015*(1+0.3*Math.max(0,mR));if(k.rel<30)st+=care*0.06;
    if(S.age>65&&k.rel>60)st-=0.04}
  if(S.age>65&&care>0&&!aliveKids().some(k=>k.rel>60)&&!(S.partner&&S.partner.rel>50))st+=0.05*care;
  S.famFx={sc,st};return {sc,st};
}

function endPartner(how){const P=S.partner;if(!P)return;S.pastPartners.push({name:P.name,g:P.g,married:P.married,how,at:S.age});
  if(P.married&&S.money>0)S.money*=0.65;S.stress=Math.min(100,S.stress+(P.married?30:15));for(const k of aliveKids())k.rel=Math.max(0,k.rel-8);

function familyYear(){

  for(const k of S.kids){if(!k.alive)continue;const a=kidAge(k),N=k.name;

    if(a>=18&&!k.moved){k.moved=true;const ok=k.rel/100*0.6+Math.min(3,k.support)*0.12+rnd()*0.4;const t=kidOutcome(k,ok);k.fate=t;
      moment(ICO[k.dir||'R'],CATS[k.dir||'R'].c,`${N} je ${gw(k.g,'dospělý','dospělá')}`,t);S.log.push(`${Math.floor(S.age)} let – ${N}: ${t}`)}
    if(a>=26&&a<45&&k.grand<3&&rnd()<0.1){k.grand++;toast(`Máš vnouče! ${N} ${gw(k.g,'má','má')} ${k.grand===1?'první dítě':'další dítě'}.`,'good');sfx('motUp');S.log.push(`${Math.floor(S.age)} let – vnouče (${N}).`)}
    if(rnd()<(a<18?0.0007:0.0015)){k.alive=false;S.stress=Math.min(100,S.stress+60);S.health=Math.max(1,S.health-12);
      moment(ICO.R,'#CFC9D8','Smutná zpráva',`${N} ${gw(k.g,'zemřel','zemřela')}. Bylo ${gw(k.g,'mu','jí')} ${Math.floor(a)} ${letStr(Math.floor(a))}.`);sfx('death');S.log.push(`${Math.floor(S.age)} let – ${N} ${gw(k.g,'zemřel','zemřela')}.`);dropInvalidFamilyCards()}
    else if(rnd()<(a<18?0.006:0.004)){S.stress=Math.min(100,S.stress+20);S.health=Math.max(1,S.health-4);k.rel=Math.min(100,k.rel+3);toast(`${N} ${gw(k.g,'měl','měla')} nehodu. Naštěstí se z toho dostane.`,'bad')}}

}

function familyStory(){
  const parts=[],P=S.partner,past=S.pastPartners,f=isF();
  const spouses=[...past.filter(p=>p.married),...(P&&P.married?[P]:[])];
  if(spouses.length===1){const s=spouses[0];parts.push(s.g==='f'?`Tvou manželkou se stala ${s.name}.`:`Tvým manželem se stal ${s.name}.`)}
  else if(spouses.length>1)parts.push(`Byl/a jsi ${spouses.length}× ${f?'vdaná':'ženatý'}.`);
  const div=past.filter(p=>p.married).length;if(div)parts.push(div===1?'Jedno manželství skončilo rozvodem.':`Rozvodů bylo ${div}.`);
  if(P&&!P.married)parts.push(`Do konce s tebou ${P.g==='f'?'byla':'byl'} ${P.name}.`);
  else if(P&&spouses.length>1)parts.push(`Nakonec ti ${P.g==='f'?'zůstala':'zůstal'} ${P.name}.`);
  else if(!P&&!spouses.length&&S.age>35)parts.push('Velkou lásku jsi nikdy nenašel/nenašla.'.replace('nenašel/nenašla',f?'nenašla':'nenašel'));
  const kids=S.kids;if(kids.length){parts.push(`${kids.length===1?'Měl/a jsi jedno dítě':`Měl/a jsi ${kids.length} ${kids.length<5?'děti':'dětí'}`}: ${kids.map(k=>k.name).join(', ')}.`);
    const close=kids.filter(k=>k.alive&&k.rel>=70).map(k=>k.name),far=kids.filter(k=>k.alive&&k.rel<35).map(k=>k.name),lost=kids.filter(k=>!k.alive).map(k=>k.name);
    if(close.length)parts.push(`Moc blízko k tobě ${close.length>1?'měli':'mělo'}: ${close.join(', ')}.`);
    if(far.length)parts.push(`Odcizil${far.length>1?'y se':'o se'} ti: ${far.join(', ')}.`);
    if(lost.length)parts.push(`Přežil/a jsi ztrátu dítěte (${lost.join(', ')}) a nikdy se s tím úplně nesrovnal/a.`);
    const g=kids.reduce((t,k)=>t+k.grand,0);if(g)parts.push(`Dočkal/a ses ${g} ${g===1?'vnoučete':'vnoučat'}.`)}
  else if(S.age>40)parts.push('Děti jsi neměl/a.');
  if(S.will==='charity')parts.push('Všechno jsi odkázal/a na dobrou věc.');else if(S.will==='kids')parts.push('Majetek jsi odkázal/a dětem.');
  return parts.join(' ')}

function sparks(x,y,col){for(let i=0;i<10;i++){const sp=document.createElement('i');sp.className='spark';const a=rnd()*Math.PI*2,d=24+rnd()*30;
  sp.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--c:${i%3?col:'#F2D07A'}`;document.body.appendChild(sp);setTimeout(()=>sp.remove(),1100)}}
function floaty(x,y,txt){const f=document.createElement('div');f.className='floaty';f.textContent=txt;f.style.left=x+'px';f.style.top=y+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),2100)}
let momT=null;
function moment(ico,col,title,sub){
  document.querySelectorAll('.moment').forEach(m=>m.remove());clearTimeout(momT);
  const m=document.createElement('div');m.className='moment box';m.innerHTML=`<span class="mi" style="background:${col}">${ico}</span><span><b></b><small></small></span>`;
  m.querySelector('b').textContent=gtxt(title);m.querySelector('small').textContent=gtxt(sub);$('.sky').appendChild(m);
  momT=setTimeout(()=>{m.classList.add('out');setTimeout(()=>m.remove(),1300)},3800);
}
function celebrateLevel(k,l){

  const el=skEls[k];if(!el)return;el.classList.remove('lvlup');void el.offsetWidth;el.classList.add('lvlup');
  const r=el.getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2,CATS[k].c);floaty(r.left+r.width/2,r.top-6,`úroveň ${l}`);
}
function celebrateMot(k,msg,v){

/* ============ ZVUK ============ */
const AU={ctx:null,mode:'all'};
try{AU.mode=localStorage.getItem('tzj-sound')||'all'}catch(e){}
const mf=m=>440*Math.pow(2,(m-69)/12);
const THEMES=[
 {bpm:70,dens:1,  chords:[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,64]],scale:[72,74,76,79,81,84,86]},   // jaro
 {bpm:74,dens:1.1,chords:[[50,57,66,73],[47,54,62,69],[43,50,59,66],[45,52,61,64]],scale:[74,76,78,81,83,86,88]},  // léto
 {bpm:66,dens:.85,chords:[[45,52,60,67,71],[41,48,57,64],[38,50,57,60,65],[40,47,55,62]],scale:[69,72,74,76,79,81,84]}, // podzim
 {bpm:60,dens:.6, chords:[[40,47,55,62,66],[36,43,52,59],[45,52,60,67],[43,50,59,66]],scale:[71,74,76,79,83,86,88]}, // zima
];
const seasonIdx=()=>Math.floor(((S?S.age:0)%1)*4)%4;
function impulse(c,sec){const len=c.sampleRate*sec,b=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(rnd()*2-1)*Math.pow(1-i/len,3.2)}return b}
function audioInit(){
  if(AU.ctx){AU.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=new AC();AU.ctx=c;
  const master=c.createGain();master.gain.value=0.85;const comp=c.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3;
  master.connect(comp);comp.connect(c.destination);
  const rev=c.createConvolver();rev.buffer=impulse(c,3.4);const rg=c.createGain();rg.gain.value=0.55;rev.connect(rg);rg.connect(master);
  const bus=(send)=>{const n=c.createGain();n.gain.value=0;n.connect(master);const sg=c.createGain();sg.gain.value=send;n.connect(sg);sg.connect(rev);return n};
  AU.music=bus(0.6);AU.sfx=bus(0.3);AU.amb=bus(0.25);
  // vítr – hnědý šum přes pomalu se hýbající pásmovou propust
  const nb=c.createBuffer(1,c.sampleRate*5,c.sampleRate),d=nb.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+0.02*(rnd()*2-1))/1.02;d[i]=l*3.5}
  const src=c.createBufferSource();src.buffer=nb;src.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=480;bp.Q.value=0.8;
  const wg=c.createGain();wg.gain.value=0;src.connect(bp);bp.connect(wg);wg.connect(AU.amb);src.start();
  const lfo=c.createOscillator();lfo.frequency.value=0.06;const lg=c.createGain();lg.gain.value=260;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
  const lfo2=c.createOscillator();lfo2.frequency.value=0.11;const lg2=c.createGain();lg2.gain.value=0;lfo2.connect(lg2);lg2.connect(wg.gain);lfo2.start();
  AU.wind=wg;AU.windMod=lg2;
  {const nb2=c.createBuffer(1,c.sampleRate,c.sampleRate),d2=nb2.getChannelData(0);for(let i=0;i<d2.length;i++)d2[i]=rnd()*2-1;AU.noise=nb2}
  AU.m={next:c.currentTime+0.4,step:0,bar:0,theme:seasonIdx(),last:c.currentTime,mel:2};
  setInterval(audioTick,100);applyMode();
  addEventListener('pointerdown',()=>{if(AU.ctx.state!=='running')AU.ctx.resume()});
}
function applyMode(){
  const lab={all:'Zvuk',nomusic:'Bez hudby',off:'Ticho'}[AU.mode];
  $('#sndBtn').innerHTML=`<span style="display:inline-flex;align-items:center;gap:6px">${AU.mode==='off'?'<svg class="i" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l4 6M21 9l-4 6"/></svg>':'<svg class="i" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'}${lab}</span>`;
  if(!AU.ctx)return;const t=AU.ctx.currentTime;
  AU.music.gain.setTargetAtTime(AU.mode==='all'?0.34:0,t,0.8);
  AU.sfx.gain.setTargetAtTime(AU.mode==='off'?0:0.6,t,0.15);
  AU.amb.gain.setTargetAtTime(AU.mode==='off'?0:0.7,t,0.8);
}
$('#sndBtn').onclick=()=>{AU.mode={all:'nomusic',nomusic:'off',off:'all'}[AU.mode];try{localStorage.setItem('tzj-sound',AU.mode)}catch(e){}audioInit();applyMode()};
function env(t,g,a,d,bus){const n=AU.ctx.createGain();n.gain.setValueAtTime(0.0001,t);n.gain.exponentialRampToValueAtTime(g,t+a);n.gain.exponentialRampToValueAtTime(0.0001,t+a+d);n.connect(bus);return n}
function osc(type,f,t,stop,dest,det=0){const o=AU.ctx.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det;o.connect(dest);o.start(t);o.stop(stop);return o}
function box(f,t,g,bus){bus=bus||AU.music;osc('sine',f,t,t+2.2,env(t,g,0.006,2,bus));osc('sine',f*2,t,t+0.7,env(t,g*0.22,0.004,0.6,bus));osc('triangle',f*4,t,t+0.25,env(t,g*0.05,0.002,0.18,bus))}
function pad(notes,t,dur){
  const c=AU.ctx,f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=850;const g=c.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.014,t+1.6);g.gain.setValueAtTime(0.014,t+dur);g.gain.linearRampToValueAtTime(0,t+dur+2.4);
  f.connect(g);g.connect(AU.music);for(const n of notes){osc('triangle',mf(n),t,t+dur+2.5,f,-6);osc('sine',mf(n),t,t+dur+2.5,f,6)}
}
function soft(f,t,g,bus){bus=bus||AU.music;const c=AU.ctx,lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1600;lp.connect(bus);
  osc('sine',f,t,t+2,env(t,g,0.02,1.5,lp));osc('sine',f*2,t,t+0.8,env(t,g*0.07,0.02,0.6,lp))}
function paper(t,dur,f1,f2,g,q){const c=AU.ctx,src=c.createBufferSource();src.buffer=AU.noise;const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=q;
  bp.frequency.setValueAtTime(f1,t);bp.frequency.exponentialRampToValueAtTime(f2,t+dur);src.connect(bp);bp.connect(env(t,g,0.012,dur,AU.sfx));src.start(t,rnd()*0.5);src.stop(t+dur+0.05)}
function bass(m,t,d){osc('sine',mf(m),t,t+d+0.2,env(t,0.07,0.06,d,AU.music))}
function audioTick(){
  const c=AU.ctx;if(!c||c.state!=='running')return;
  const M=AU.m;let th=THEMES[M.theme];
  while(M.next<c.currentTime+0.4){
    const e=60/th.bpm/2,t=M.next,ch=th.chords[M.bar%th.chords.length];
    if(M.step===0){pad(ch,t,e*8*1.05);bass(ch[0]-12,t,e*7)}
    if(M.bar%8!==7){const p=(M.step%2===0?0.17:0.04)*th.dens;
      if(rnd()<p){M.mel=clamp(M.mel+[-2,-1,-1,0,1,1,2][Math.floor(rnd()*7)],0,th.scale.length-1);soft(mf(th.scale[M.mel]-12),t,0.04)}}
    M.next+=e;M.step++;
    if(M.step===8){M.step=0;M.bar++;const want=seasonIdx();
      if(want!==M.theme&&c.currentTime-M.last>110&&M.bar%4===0){M.theme=want;M.last=c.currentTime;M.bar=0;th=THEMES[want]}}
  }
  const fr=S?S.age%1:0.1,spr=sw(fr,0.125),sum=sw(fr,0.375),aut=sw(fr,0.625),win=sw(fr,0.875);
  const wb=win*0.2+aut*0.05;AU.wind.gain.setTargetAtTime(wb,c.currentTime,2);AU.windMod.gain.setTargetAtTime(wb*0.5,c.currentTime,2);
  if(rnd()<spr*0.035+sum*0.01)bird();
  if(rnd()<sum*0.012)cricket();
}
function bird(){
  const c=AU.ctx,t=c.currentTime+0.05,pan=c.createStereoPanner();pan.pan.value=rnd()*1.6-0.8;pan.connect(AU.amb);
  const n=2+Math.floor(rnd()*4),base=2400+rnd()*2000;let tt=t;
  for(let i=0;i<n;i++){const o=osc('sine',base,tt,tt+0.15,env(tt,0.018+rnd()*0.01,0.01,0.08,pan));
    o.frequency.setValueAtTime(base*(0.9+rnd()*0.2),tt);o.frequency.exponentialRampToValueAtTime(base*(1.2+rnd()*0.35),tt+0.05);o.frequency.exponentialRampToValueAtTime(base*0.85,tt+0.1);
    tt+=0.09+rnd()*0.1}
}
function cricket(){const c=AU.ctx,t=c.currentTime+0.05,pan=c.createStereoPanner();pan.pan.value=rnd()*1.4-0.7;pan.connect(AU.amb);
  for(let i=0;i<9;i++)osc('sine',4300,t+i*0.035,t+i*0.035+0.03,env(t+i*0.035,0.004,0.003,0.02,pan))}
function sfx(name){
  if(!AU.ctx||AU.mode==='off'||AU.ctx.state!=='running')return;
  const c=AU.ctx,t=c.currentTime+0.01,B=AU.sfx,sc=THEMES[AU.m.theme].scale;
  if(name==='appear'){paper(t,0.24,2600,1300,0.12,0.7);paper(t+0.07,0.14,1300,800,0.06,0.9)}
  else if(name==='pick'){paper(t,0.08,3800,2600,0.07,1.1)}
  else if(name==='place'){paper(t,0.13,1900,700,0.13,0.7);const o=osc('sine',150,t,t+0.25,env(t,0.07,0.004,0.15,B));o.frequency.exponentialRampToValueAtTime(90,t+0.15)}
  else if(name==='remove'){paper(t,0.38,3200,600,0.08,0.6)}
  else if(name==='level'){[0,2,4,0].forEach((ix,i)=>soft(mf(sc[ix]-12+(i===3?12:0)),t+i*0.12,0.06,B));paper(t,0.3,4000,2500,0.03,0.6)}
  else if(name==='motUp'){soft(mf(sc[1]),t,0.05,B);soft(mf(sc[3]),t+0.22,0.05,B);soft(mf(sc[5]),t+0.44,0.045,B)}
  else if(name==='motDown'){soft(mf(sc[4]-12),t,0.05,B);soft(mf(sc[2]-13),t+0.28,0.045,B)}
  else if(name==='ill'){osc('sine',mf(52),t,t+1.2,env(t,0.05,0.08,0.9,B));osc('sine',mf(53),t,t+1.2,env(t,0.025,0.08,0.9,B))}
  else if(name==='death'){[6,4,2,0].forEach((ix,i)=>soft(mf(sc[ix]-12),t+i*0.5,0.05,B))}
}
applyMode();

/* ============ POSTAVIČKA U VĚKU ============ */
const kc=$('#kid').getContext('2d');
function drawKid(now){
  const a=S?S.age:0,moving=!paused&&!(S&&S.dead),fps=a>65?2:a<1.5?2.5:3.5,f=moving?Math.floor(now/1000*fps)%2:0;
  kc.clearRect(0,0,16,16);const P_=(x,y,w,h,c)=>{kc.fillStyle=c||'#33302E';kc.fillRect(x,y,w,h)};const hair=a>60?'#8A8590':'#33302E';
  if(a<1.5){ // leze
    P_(10,8,4,4);P_(4,9,7,3);P_(f?10:8,12,1,3);P_(f?7:9,12,1,3);P_(f?4:6,12,1,3);P_(f?7:5,12,1,2);
  }else if(a<5){ // batole
    P_(5,5,5,5);P_(6,10,4,3);P_(f?5:6,13,1,3);P_(f?9:8,13,1,3);P_(f?10:9,10,1,2);P_(f?5:5,10,1,2);
  }else if(a<12){ // dítě
    P_(6,2,4,4);P_(6,6,4,5);if(isF()){P_(5,3,1,4);P_(5,9,6,2)}P_(f?5:6,11,1,5);P_(f?9:8,11,1,5);P_(f?10:10,7,1,3);P_(5,7,1,3);
  }else if(a<65){ // dospělý
    P_(6,0,4,4,hair);P_(6,1,4,3);P_(6,0,4,1,hair);P_(6,4,4,6);if(isF()){P_(5,1,1,5,hair);P_(5,8,6,3)}P_(f?5:6,10,1,6);P_(f?9:8,10,1,6);P_(f?10:10,5,1,4);P_(5,5,1,4);
  }else{ // senior s holí
    P_(8,1,4,4);P_(8,1,4,1,hair);P_(7,5,4,5);P_(6,5,1,2);P_(f?7:8,10,1,6);P_(f?10:9,10,1,6);P_(11,6,2,1);P_(13,6,1,10,'#7A6152');
  }
}

/* ============ SMYČKA ============ */
let last=performance.now();
function frame(now){const dtR=Math.min(0.1,(now-last)/1000);last=now;
  if(!paused&&!S.dead){let rem=dtR*speed;while(rem>0&&!S.dead){const d=Math.min(rem,0.05);step(d);rem-=d}}
  if(dirty)renderTimeline();updateHUD();updateOffers();drawScene(now);drawKid(now);requestAnimationFrame(frame)}
buildAxis();newLife();S.R=computeRates();renderTimeline();intro(true);requestAnimationFrame(frame);
</script>
